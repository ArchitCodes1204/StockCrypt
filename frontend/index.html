<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>StockCrypt</title>
  <meta name="description"
    content="StockCrypt: research stocks and crypto with rule-based technical analysis, track a portfolio and a watchlist, and compare assets side by side." />
  <meta name="theme-color" content="#0A0D12" />
  <meta name="color-scheme" content="dark light" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" type="image/png" href="/favicon.png" />

  <!-- Apply the saved theme before first paint (no flash). ThemeProvider takes over after mount. -->
  <script>
    (function () {
      var theme = 'dark';
      try {
        var saved = localStorage.getItem('sc-theme');
        if (saved === 'light' || saved === 'dark') theme = saved;
      } catch (e) { /* storage blocked: keep the default */ }
      var root = document.documentElement;
      root.setAttribute('data-theme', theme);
      root.style.colorScheme = theme;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#F6F5F0' : '#0A0D12');
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" />
</head>

<body>
  <noscript>StockCrypt needs JavaScript to run.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
